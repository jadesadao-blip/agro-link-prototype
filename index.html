<!doctype html>
<html lang="lo">
<meta charset="utf-8">
<title>Lao Agro Link · Web App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="agroapp-styles">
:root{
  --paper:#FAFBF8; --surface:#FFFFFF; --surface-2:#F1F5EC; --line:#DDE4D8; --line-strong:#C3CEBB;
  --ink:#16211B; --ink-soft:#3C4A41; --muted:#647065;
  --green:#1C5D3C; --green-2:#2E7D46; --green-bg:#E5EFE7; --green-line:#9BC1A6;
  --gold:#8F6608; --gold-bg:#F6EDD5; --gold-line:#DFC384;
  --blue:#2F6FCB; --blue-bg:#E1EAF7; --purple:#6E5DA0; --purple-bg:#ECE6F5;
  --crit:#A9382C; --crit-bg:#F6E3DF;
  --sidebar:#FFFFFF; --hero-ink:#FFFFFF; --r:12px;
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --paper:#0E1310; --surface:#151D18; --surface-2:#1B241E; --line:#2A352C; --line-strong:#3A473C;
  --ink:#E7EFE8; --ink-soft:#BBC8BD; --muted:#8B998D;
  --green:#5FB584; --green-2:#7FC99C; --green-bg:#16261C; --green-line:#2E5540;
  --gold:#E0B44A; --gold-bg:#2B2413; --gold-line:#5A4A1E;
  --blue:#6FA0E6; --blue-bg:#152238; --purple:#A996D8; --purple-bg:#211B33;
  --crit:#E08C7F; --crit-bg:#2E1712; --sidebar:#131A16;
}}
:root[data-theme="dark"]{
  --paper:#0E1310; --surface:#151D18; --surface-2:#1B241E; --line:#2A352C; --line-strong:#3A473C;
  --ink:#E7EFE8; --ink-soft:#BBC8BD; --muted:#8B998D;
  --green:#5FB584; --green-2:#7FC99C; --green-bg:#16261C; --green-line:#2E5540;
  --gold:#E0B44A; --gold-bg:#2B2413; --gold-line:#5A4A1E;
  --blue:#6FA0E6; --blue-bg:#152238; --purple:#A996D8; --purple-bg:#211B33;
  --crit:#E08C7F; --crit-bg:#2E1712; --sidebar:#131A16;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans Lao","IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","Noto Sans Lao",monospace}
h1,h2,h3,h4{font-family:"Bai Jamjuree","Noto Sans Lao",sans-serif;margin:0;font-weight:600;line-height:1.22;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
img{max-width:100%}
::selection{background:color-mix(in srgb,var(--green) 25%,transparent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.brand{display:flex;align-items:center;gap:9px;font-family:"Bai Jamjuree";font-weight:700;font-size:16px;white-space:nowrap;text-decoration:none;color:inherit}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--green);display:grid;place-items:center;color:#fff;flex:none}
:root[data-theme="dark"] .brand .dot{color:#0E1310}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .dot{color:#0E1310}}
.btn{border:1px solid var(--green);background:var(--green);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:filter .12s,border-color .12s}
:root[data-theme="dark"] .btn{color:#0E1310}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1310}}
.btn:hover{filter:brightness(1.07)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--green);color:var(--green);filter:none}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none}
.lng{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.lng button{border:none;background:none;color:var(--muted);font-size:12.5px;padding:6px 11px;font-weight:600}
.lng button[aria-pressed="true"]{background:var(--green);color:#fff}
:root[data-theme="dark"] .lng button[aria-pressed="true"]{color:#0E1310}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lng button[aria-pressed="true"]{color:#0E1310}}
.chip{font-family:"IBM Plex Mono","Noto Sans Lao",monospace;font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.chip.g{border-color:var(--green-line);color:var(--green);background:var(--green-bg)}
.chip.gold{border-color:var(--gold-line);color:var(--gold);background:var(--gold-bg)}
.chip.b{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.chip.p{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.chip.r{border-color:var(--crit);color:var(--crit);background:var(--crit-bg)}
.pubnav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.pubnav .in{max-width:1180px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px}
.pubnav .sp{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hero{position:relative;overflow:hidden}
.hero .bg{position:absolute;inset:0;background:linear-gradient(115deg,rgba(19,60,38,.93),rgba(28,93,60,.72) 55%,rgba(143,102,8,.30)),repeating-linear-gradient(100deg,#2e7d46 0 22px,#256a3b 22px 46px)}
.hero .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 80% 10%,rgba(240,220,150,.22),transparent 60%)}
.hero .in{position:relative;max-width:1180px;margin:0 auto;padding:76px 22px 84px;color:var(--hero-ink)}
.hero h1{font-size:clamp(34px,6vw,62px);font-weight:700;letter-spacing:-.01em;color:#fff;max-width:16ch}
.hero p{font-size:clamp(16px,2vw,20px);max-width:52ch;margin:20px 0 0;color:rgba(255,255,255,.92)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero .trust{margin-top:26px;font-family:"IBM Plex Mono","Noto Sans Lao";font-size:12.5px;color:rgba(255,255,255,.85)}
.section{max-width:1180px;margin:0 auto;padding:56px 22px}
.section h2{font-size:clamp(24px,3.4vw,32px);text-align:center;color:var(--green)}
.section .lead{text-align:center;color:var(--muted);margin:10px auto 0;max-width:60ch}
.flow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:34px}
.flow .step{display:flex;align-items:center;gap:10px}
.flow .pill{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green-2);border-radius:22px;padding:10px 16px;font-size:14px;font-weight:500;display:flex;flex-direction:column;line-height:1.2;align-items:center}
.flow .pill.last{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.flow .pill small{font-family:"IBM Plex Mono";font-size:10px;opacity:.75;font-weight:400}
.flow .arw{color:var(--line-strong);font-size:18px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:38px}
.feat .c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.feat .c .ic{width:40px;height:40px;border-radius:10px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;margin-bottom:12px}
.feat .c h3{font-size:16px;margin-bottom:6px}
.feat .c p{font-size:13.5px;color:var(--ink-soft);margin:0}
.pubfoot{border-top:1px solid var(--line);background:var(--surface-2)}
.pubfoot .in{max-width:1180px;margin:0 auto;padding:26px 22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(120% 80% at 50% -10%,var(--green-bg),transparent 60%)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(20,40,25,.08)}
.logincard{width:100%;max-width:410px;padding:30px 30px 26px}
.logincard .lgtop{display:flex;justify-content:center;margin-bottom:8px}
.logincard h2{text-align:center;font-size:22px;color:var(--green)}
.logincard .sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 22px}
.f{display:block;margin-bottom:14px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.f input{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;font-family:inherit}
.demoflag{font-size:11.5px;color:var(--gold);background:var(--gold-bg);border:1px dashed var(--gold-line);border-radius:8px;padding:7px 10px;margin:2px 0 16px;text-align:center}
.linkrow{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.linkrow a{color:var(--green);font-weight:600;text-decoration:none;cursor:pointer}
.or-div{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--muted);font-size:11.5px;font-family:"IBM Plex Mono","Noto Sans Lao"}
.or-div::before,.or-div::after{content:"";flex:1;height:1px;background:var(--line)}
.tester{border:1px dashed var(--gold-line);background:var(--gold-bg);border-radius:12px;padding:14px}
.tester-lab{font-family:"IBM Plex Mono","Noto Sans Lao";font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;gap:6px;align-items:center}
.tester-hint{font-size:12px;color:var(--ink-soft);margin:7px 0 11px;line-height:1.5}
.tester-row{display:flex;gap:8px}
.tester-row select{flex:1;min-width:0;font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
.tester-row .btn{white-space:nowrap;flex:none}
.rolewrap{min-height:100vh;padding:40px 20px 60px;background:radial-gradient(120% 60% at 50% -10%,var(--green-bg),transparent 55%)}
.rolehead{text-align:center;max-width:640px;margin:10px auto 30px}
.rolehead .logo{width:56px;height:56px;border-radius:16px;background:var(--green);display:grid;place-items:center;margin:0 auto 16px;color:#fff}
:root[data-theme="dark"] .rolehead .logo{color:#0E1310}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rolehead .logo{color:#0E1310}}
.rolehead h2{font-size:28px;color:var(--green)}
.rolehead p{color:var(--muted);margin-top:8px}
.rolegrid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:720px){.rolegrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.rolegrid{grid-template-columns:1fr}}
.rolecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.rolecard:hover{transform:translateY(-3px);border-color:var(--green-line);box-shadow:0 8px 24px rgba(20,40,25,.09)}
.rolecard .ic{width:44px;height:44px;margin:0 auto 12px;color:var(--green);display:grid;place-items:center}
.rolecard .lo{font-family:"Noto Sans Lao";font-weight:600;font-size:15px}
.rolecard .en{font-family:"IBM Plex Mono";font-size:11px;color:var(--muted);margin-top:3px}
.backlink{display:block;text-align:center;margin-top:26px;color:var(--muted);font-size:14px;text-decoration:none}
.backlink:hover{color:var(--green)}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
@media (max-width:860px){.shell{grid-template-columns:1fr}}
.side{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
@media (max-width:860px){.side{position:fixed;z-index:50;width:238px;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}.side.open{transform:none}}
.side .top{padding:18px 18px 12px}
.side nav{padding:6px 12px;flex:1;overflow-y:auto}
.side nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-soft);text-decoration:none;font-size:14px;margin-bottom:2px;cursor:pointer}
.side nav a .ic{width:19px;height:19px;flex:none;color:var(--muted)}
.side nav a:hover{background:var(--surface-2)}
.side nav a.on{background:var(--green-bg);color:var(--green);font-weight:600}
.side nav a.on .ic{color:var(--green)}
.side nav a .en{font-family:"IBM Plex Mono";font-size:10px;color:var(--muted);margin-left:auto}
.side .bot{padding:12px;border-top:1px solid var(--line)}
.side .bot a{display:flex;align-items:center;gap:10px;padding:9px 12px;color:var(--muted);text-decoration:none;font-size:13.5px;border-radius:9px;cursor:pointer}
.side .bot a:hover{background:var(--surface-2);color:var(--ink)}
.main{min-width:0;display:flex;flex-direction:column}
.apptop{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px}
.apptop h1{font-size:19px}
.apptop .burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 9px}
@media (max-width:860px){.apptop .burger{display:inline-flex}}
.apptop .sp{margin-left:auto;display:flex;gap:9px;align-items:center}
.rolebadge{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line);font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:20px;white-space:nowrap}
.rolebadge.gov{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.rolebadge.guest{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.content{padding:24px;max-width:1240px;width:100%;margin:0 auto}
.greet h2{font-size:26px}
.greet p{color:var(--muted);margin:4px 0 0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:22px 0}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.scard .lab{font-size:12.5px;color:var(--muted)}
.scard .big{font-family:"Bai Jamjuree","Noto Sans Lao";font-weight:700;font-size:26px;margin-top:4px;color:var(--green);font-variant-numeric:tabular-nums}
.scard .big.gold{color:var(--gold)} .scard .big.blue{color:var(--blue)}
.scard .sub{font-size:12px;color:var(--muted);margin-top:2px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:18px 0}
.block .bh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.block .bh h3{font-size:16px}
.block .bh .r{margin-left:auto;font-size:13px;color:var(--green);font-weight:600}
.progress{height:12px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--green));border-radius:8px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink);font-size:14px;font-weight:500}
.qa button:hover{border-color:var(--green-line);color:var(--green)}
.qa .ic{color:var(--green)}
.lifecycle{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.lifecycle .st{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.lifecycle .n{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-family:"IBM Plex Mono";font-weight:600}
.lifecycle .st.done{color:var(--green)} .lifecycle .st.done .n{background:var(--green);color:#fff;border-color:var(--green)}
:root[data-theme="dark"] .lifecycle .st.done .n{color:#0E1310}
.lifecycle .st.cur{color:var(--gold)} .lifecycle .st.cur .n{background:var(--gold);color:#fff;border-color:var(--gold)}
.lifecycle .arw{color:var(--line-strong)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-family:"IBM Plex Mono","Noto Sans Lao"}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tablewrap table{min-width:520px}
.qr{width:66px;height:66px;border-radius:12px;background:conic-gradient(from 0deg,#0000 0 25%,currentColor 0 50%,#0000 0 75%,currentColor 0),var(--surface-2);background-size:14px 14px;border:1px solid var(--line);color:var(--ink-soft);opacity:.75}
.tl{position:relative;margin-top:10px}
.tl .ev{display:flex;gap:14px;padding-bottom:20px;position:relative}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.tl .ev:last-child::before{display:none}
.tl .d{width:16px;height:16px;border-radius:50%;border:3px solid var(--green);background:var(--surface);flex:none;margin-top:2px;z-index:1}
.tl .ev.pending .d{border-color:var(--line-strong)}
.tl .ev.pending{opacity:.6}
.tl h4{font-size:14.5px}
.tl .m{font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono","Noto Sans Lao"}
.market{display:grid;grid-template-columns:1fr 1.2fr .95fr;gap:14px;align-items:start}
@media (max-width:1080px){.market{grid-template-columns:1fr 1fr}.market .col-side{grid-column:1/-1}}
@media (max-width:660px){.market{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel .ph{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel .ph h3{font-size:14.5px}
.panel .ph .c{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;color:var(--muted)}
.panel .pb{padding:13px 16px;max-height:620px;overflow-y:auto}
.mribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.lotcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .12s}
.lotcard:hover{border-color:var(--line-strong)}
.lotcard.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.lotcard .r1{display:flex;align-items:center;gap:8px}
.lotcard .id{font-family:"IBM Plex Mono";font-weight:600;font-size:12.5px}
.lotcard .qty{margin-left:auto;font-family:"IBM Plex Mono";font-weight:600;color:var(--gold);font-size:13px}
.lotcard .r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lotcard .offer{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;display:flex;gap:8px;align-items:center}
.lotcard .offer .pr{font-family:"IBM Plex Mono";font-weight:600;color:var(--green)}
.dz{color:var(--muted);text-align:center;padding:34px 14px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:12px 0;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;text-align:right;font-family:"IBM Plex Mono","Noto Sans Lao";font-size:12.5px}
.slab{font-family:"IBM Plex Mono","Noto Sans Lao";font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.prov{display:flex;flex-wrap:wrap;gap:5px}
.prov .p{font-family:"IBM Plex Mono";font-size:11px;background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.chain .node{display:flex;gap:11px;position:relative;padding-bottom:13px}
.chain .node:last-child{padding-bottom:0}
.chain .node::before{content:"";position:absolute;left:6px;top:17px;bottom:-3px;width:2px;background:var(--line)}
.chain .node:last-child::before{display:none}

body{font-feature-settings:"cv05","ss01";letter-spacing:.001em}
/* content atmosphere */
.main{background:radial-gradient(130% 90% at 100% -5%,color-mix(in srgb,var(--green) 6%,transparent),transparent 45%),radial-gradient(90% 70% at 0% 100%,color-mix(in srgb,var(--gold) 4%,transparent),transparent 50%)}

.scard,.block,.panel,.rc,.stbox,.feat .c,.lp-stat,.lp-fcard,.tablewrap,.card{box-shadow:var(--sh-sm)}
.block,.panel,.rc{border-radius:18px}
.scard,.stbox{border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.scard::after,.stbox::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 8%,transparent),transparent)}
.block{padding:22px 24px}
/* interactive lift */
.lotcard,.rc,.qa button,.rolecard,.feat .c,.lp-fcard,.lp-ccard{transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s}
.lotcard:hover,.qa button:hover,.feat .c:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.rc:hover{box-shadow:var(--sh-md)}
.lotcard.sel{box-shadow:0 0 0 1.5px var(--green),var(--sh-md)}
/* stat numbers — premium typography */
.scard .big{font-size:clamp(26px,3vw,32px);letter-spacing:-.025em;line-height:1.05}
.scard .lab,.stbox .l{letter-spacing:.02em}
.greet h2{letter-spacing:-.015em}
h2,h1{letter-spacing:-.02em}
/* sidebar refinement */
.side{box-shadow:var(--sh-sm)}
.side .top{padding:20px 18px 14px}
.side nav a{transition:background .15s,color .15s;font-weight:500}
.side nav a.on{position:relative;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 18%,transparent)}
.side nav a.on::after{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
.side nav{padding:8px 12px}
/* topbar */
.apptop{padding:14px 26px;box-shadow:0 1px 0 var(--line)}
.apptop h1{letter-spacing:-.015em}
.rolebadge{box-shadow:var(--sh-sm)}
.avatar{box-shadow:var(--sh-sm)}
/* buttons */
.btn{box-shadow:var(--sh-sm);border-radius:10px;transition:transform .14s,filter .14s,box-shadow .14s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.btn.ghost{box-shadow:none}
.btn.ghost:hover{box-shadow:var(--sh-sm)}
/* quick-action tiles */
.qa button{border-radius:16px;padding:24px 14px}
.qa .ic{width:44px;height:44px;border-radius:13px;background:var(--green-bg);display:grid;place-items:center}
/* tables */
.tablewrap{border-radius:16px}
tbody tr{transition:background .12s}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
thead th{letter-spacing:.04em}
/* progress bar */
.progress{height:14px;border-radius:9px}
.progress i{box-shadow:0 0 12px color-mix(in srgb,var(--green) 45%,transparent)}
/* chips slightly softer */
.chip{border-radius:9px}
.lotcard .chip,.rc .chip{border-radius:20px}
/* inbox rows */
.reqrow{padding:13px 2px}
.reqrow:hover{background:color-mix(in srgb,var(--surface-2) 45%,transparent);border-radius:10px}
/* modal premium */
.modalbg{backdrop-filter:blur(5px);background:rgba(8,14,10,.55)}
.modal{box-shadow:var(--sh-lg);border-radius:20px;padding:26px}
.modal h3{font-size:19px;letter-spacing:-.01em}
.modal .fld input,.modal .fld select,.fld select,.fld input{transition:border-color .14s,box-shadow .14s}
.modal .fld input:focus,.modal .fld select:focus,.fld input:focus,.fld select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--ring);outline:none}
/* panel headers */
.panel .ph{padding:15px 18px}
.panel .pb{padding:15px 18px}
.block .bh h3::before,.panel .ph h3::before{height:15px;box-shadow:0 0 8px color-mix(in srgb,var(--green) 40%,transparent)}
/* section eyebrow underlines etc kept */
/* focus visible refinement */
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
/* subtle divider between greet and stats */
.greet{padding-bottom:4px}
.statgrid{gap:16px;margin:24px 0}
.mribbon{gap:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------------- trade actions ---------------- */
function doTransfer(lotId,toId,price,label){
 const lot=A.lots[lotId]; if(!lot) return false;
 if(price<A.floor){logNo(isLo()?`ປະຕິເສດ: ${money(price)}/kg ຕ່ຳກວ່າ Floor`:`Rejected: ${money(price)}/kg below Floor`);toast(isLo()?'ບລ໊ອກ: ຕ່ຳກວ່າ Floor':'Blocked: below Floor','bad');return false;}
 if(!['IN_WAREHOUSE','TRADED','PROCESSED'].includes(lot.state)){logNo((isLo()?'ຍັງຂາຍບໍ່ໄດ້ ':'Not sellable ')+lotId+(isLo()?' — ຕ້ອງເຂົ້າສາງກ່ອນ':' — must be in warehouse'));toast(isLo()?'ຕ້ອງເຂົ້າສາງກ່ອນຂາຍ':'Must be in warehouse first','bad');return false;}
 const from=lot.holder; lot.holder=toId; lot.state='TRADED'; lot.reserved=false;
 A.tradeVolume+=price*lot.qty*1000;
 const off=A.offers.find(o=>o.lot===lotId&&o.status==='open'); if(off) off.status='filled';
 pushLedger({type:'transfer',lot:lotId,from,to:toId,qty:lot.qty,price});
 logOk((label||(isLo()?'ໂອນກຳມະສິດ ':'Transfer '))+lotId+' · '+pn(from)+' → '+pn(toId)+' @ '+money(price)+'/kg');
 return true;
}
function payFor(buyer,seller,value){A.wallets[buyer]=(A.wallets[buyer]||0)-value;A.wallets[seller]=(A.wallets[seller]||0)+value;pushLedger({type:'payout',lot:'—',from:buyer,to:seller,qty:0,price:0,amount:value});logMv((isLo()?'ຊຳລະເງິນ ':'Paid ')+money(value)+' · '+pn(buyer)+' → '+pn(seller));}
function transferOwnership(lotId,toId,price){
 const lot=A.lots[lotId]; if(!lot){render();return;}
 const value=price*lot.qty*1000, seller=lot.holder;
 if((A.wallets[toId]||0)<value){toast(isLo()?'ກະເປົາເງິນຜູ້ຊື້ບໍ່ພຽງພໍ':'Buyer wallet too low','bad');logNo((isLo()?'ຊື້ບໍ່ໄດ້: ເງິນບໍ່ພຽງພໍ ':'Insufficient funds ')+pn(toId));render();return;}
 if(doTransfer(lotId,toId,price)){ payFor(toId,seller,value); toast(isLo()?'ໂອນ + ຊຳລະເງິນສຳເລັດ (payout ເຂົ້າຜູ້ຂາຍ)':'Transferred + paid','good'); } render();
}
function postOffer(lotId,price,model){
 if(price<A.floor){toast(isLo()?'ຕັ້ງລາຄາຕ່ຳກວ່າ Floor ບໍ່ໄດ້':'Cannot post below Floor','bad');logNo((isLo()?'ຕັ້ງຂາຍບໍ່ໄດ້: ':'Post rejected: ')+money(price)+' < Floor');render();return;}
 A.offers=A.offers.filter(o=>!(o.lot===lotId&&o.status==='open'));
 A.offers.push({lot:lotId,price,model,status:'open'});
 logOk((isLo()?'ຕັ້ງຂາຍ ':'Posted ')+lotId+' @ '+money(price)+'/kg');
 toast(isLo()?'ຕັ້ງຂາຍເຂົ້າຕະຫຼາດ':'Posted to market','good');render();
}
function withdraw(lotId){
 const lot=A.lots[lotId];const days=Math.max(1,A.day-lot.since);const fee=days*STORAGE_RATE*lot.qty;
 A.storageFees+=fee; lot.state='WITHDRAWN';
 pushLedger({type:'withdraw',lot:lotId,from:lot.holder,to:lot.holder,qty:lot.qty,fee});
 logMv((isLo()?'ຖອນອອກ ':'Withdraw ')+lotId+' · '+days+(isLo()?' ວັນ · ຄ່າຝາກ ':' d · fee ')+money(fee));
 A.selected=null;toast(isLo()?'ຖອນອອກ + ຄິດຄ່າຝາກ':'Withdrawn + storage fee','');render();
}

 pushLedger({type:'convert',lot:nid,from:lotId,to:lot.holder,qty:out});

 const lot=A.lots[lotId];const remain=A.quota.granted-A.quota.consumed;
 if(lot.tier<2){logNo((isLo()?'ປະຕິເສດສົ່ງອອກ ':'Export rejected ')+lotId+(isLo()?': ຕ້ອງຜ່ານຕະຫຼາດ 2':': need tier 2'));toast(isLo()?'ບລ໊ອກ: ຍັງບໍ່ຮອດຕະຫຼາດ 3':'Blocked: not tier 3','bad');render();return;}
 if(lot.qty>remain){logNo((isLo()?'ປະຕິເສດສົ່ງອອກ ':'Export rejected ')+lotId+(isLo()?`: ເກີນໂຄຕ້າ (ເຫຼືອ ${remain}T)`:`: over quota`));toast(isLo()?'ບລ໊ອກ: ເກີນໂຄຕ້າ':'Blocked: over quota','bad');render();return;}
 A.quota.consumed+=lot.qty; lot.state='EXPORTED';
 pushLedger({type:'export',lot:lotId,from:lot.holder,to:(isLo()?'ດ່ານສົ່ງອອກ':'Export gate'),qty:lot.qty});
 logOk((isLo()?'ສົ່ງອອກ ':'Export ')+lotId+' · '+lot.qty+'T');
 A.selected=null;toast(isLo()?'ສົ່ງອອກສຳເລັດ':'Exported','good');render();
}
/* --- Contract (Smart Contract 50/50) --- */
function createContract(lotId,buyer,price){
 const lot=A.lots[lotId]; if(price<A.floor){toast(isLo()?'ລາຄາຕ່ຳກວ່າ Floor':'Below Floor','bad');logNo((isLo()?'ສັນຍາບໍ່ໄດ້: ':'Contract rejected: ')+money(price)+' < Floor');render();return;}
 const value=price*lot.qty*1000, dep=value/2;
 if((A.wallets[buyer]||0)<dep){toast(isLo()?'ກະເປົາເງິນຜູ້ຊື້ບໍ່ພຽງພໍວາງມັດຈຳ':'Buyer wallet too low for deposit','bad');logNo((isLo()?'ສັນຍາບໍ່ໄດ້: ມັດຈຳບໍ່ພຽງພໍ ':'Contract rejected: deposit ')+pn(buyer));render();return;}
 A.wallets[buyer]-=dep; A.escrowHeld+=dep; lot.reserved=true;
 A.contracts.unshift({lot:lotId,seller:lot.holder,buyer,price,qty:lot.qty,deposit:dep,value,status:'awaiting',at:A.day});
 logOk((isLo()?'ເຮັດສັນຍາ ':'Contract ')+lotId+' · '+pn(buyer)+' · '+(isLo()?'ວາງມັດຈຳ ':'deposit ')+money(dep));
 A.sideView='ctr'; toast(isLo()?'ເຮັດສັນຍາ + ວາງມັດຈຳ 50%':'Contract created + 50% deposit','good');render();
}
function settleContract(i){
 const c=A.contracts[i]; if(!c||c.status!=='awaiting') return;
 const remaining=c.value-c.deposit;
 if((A.wallets[c.buyer]||0)<remaining){toast(isLo()?'ຍອດເງິນຄົງເຫຼືອບໍ່ພຽງພໍຊຳລະ':'Insufficient to settle','bad');return;}
 A.wallets[c.buyer]-=remaining; A.escrowHeld-=c.deposit; A.wallets[c.seller]=(A.wallets[c.seller]||0)+c.value;
 doTransfer(c.lot,c.buyer,c.price,isLo()?'ສົ່ງມອບສັນຍາ ':'Settle contract ');
 c.status='settled';
 logOk((isLo()?'ຊຳລະຄົບ ':'Settled ')+c.lot+' · '+pn(c.buyer)+' · '+money(c.value));
 toast(isLo()?'ສົ່ງມອບ + ຊຳລະຄົບ + ໂອນກຳມະສິດ':'Delivered + paid + ownership transferred','good');render();
}
/* --- Future (trigger) --- */
function createFuture(lotId,buyer,trigger){
 if(trigger<A.floor){toast(isLo()?'trigger ຕ້ອງ ≥ Floor':'trigger must be ≥ Floor','bad');render();return;}
 A.futures.unshift({lot:lotId,buyer,trigger,status:'pending',at:A.day});
 logOk((isLo()?'ຕັ້ງ Future ':'Future ')+lotId+' · '+pn(buyer)+' · '+(isLo()?'ຊື້ເມື່ອ ≤ ':'buy when ≤ ')+money(trigger));
 A.sideView='ctr'; toast(isLo()?'ຕັ້ງຄຳສັ່ງ Future ສຳເລັດ':'Future order placed','good');render();
}
function tickMarket(delta){
 A.marketPrice=Math.max(3800,Math.min(5200,A.marketPrice+delta));
 // fire pending futures where market <= trigger
 A.futures.forEach(f=>{
   if(f.status==='pending' && A.marketPrice<=f.trigger){
     const lot=A.lots[f.lot];
     if(lot && lot.state!=='EXPORTED' && lot.state!=='WITHDRAWN'){
       const fp=Math.max(A.floor,Math.round(A.marketPrice)), val=fp*lot.qty*1000, seller=lot.holder;
       if((A.wallets[f.buyer]||0)>=val){ const ok=doTransfer(f.lot,f.buyer,fp,isLo()?'Future ຍິງ ':'Future fired '); if(ok){ payFor(f.buyer,seller,val); f.status='fired'; toast(isLo()?('Future ຍິງ! '+f.lot+' ທີ່ '+money(fp)):('Future fired '+f.lot),'good'); } }
     } else { f.status='void'; }
   }
 });
 render();
}

function ledgerLine(e){const b='<b>'+e.lot+'</b> ';

 if(e.type==='withdraw') return b+(isLo()?'ຖອນອອກ':'withdraw')+' · '+e.qty+'T';
 if(e.type==='convert') return b+(isLo()?'ແປຮູບຈາກ ':'from ')+e.from+' · '+e.qty+'T';
 if(e.type==='export') return b+(isLo()?'ສົ່ງອອກ → ':'export → ')+e.to+' · '+e.qty+'T';
 if(e.type==='payout') return (isLo()?'💰 ຊຳລະເງິນ ':'💰 Payout ')+pn(e.from)+' → '+pn(e.to);
 if(e.type==='certify') return b+(isLo()?'ອອກໃບຮັບຮອງ ✓':'certified ✓');
 if(e.type==='intake') return b+(isLo()?'ຮັບເຂົ້າສາງ':'intake')+' · '+e.qty+'T';

 return b;
}

/* ═══ Requests / Inbox — closed loop (ສວນ→ສາງ→ໂຮງງານ→ກັບ) ═══ */
const ROLE_PARTY={farmer:'SUN_A',livestock:'SUN_B',trader:'TRD_1',warehouse:'WH_1',factory:'FAC_1',exporter:'EXP_1'};
function actingParty(){return ROLE_PARTY[A.role]||null;}
function roleOfParty(pid){ if(!pid)return null; if(pid.indexOf('SUN')===0)return 'farmer'; if(pid==='TRD_1'||pid==='TRD_2')return 'trader'; if(pid==='WH_1')return 'warehouse'; if(pid==='FAC_1')return 'factory'; if(pid==='EXP_1')return 'exporter'; return 'trader'; }
const REQ_LABEL={INSPECT:{lo:'ຂໍກວດແປງ',en:'Inspection'},DEPOSIT:{lo:'ຂໍຝາກສາງ',en:'Warehouse deposit'},PURCHASE:{lo:'ໃບສັ່ງຊື້',en:'Purchase order'},QUOTA:{lo:'ຂໍໂຄຕ້າ',en:'Quota'}};
function reqLabel(x){return REQ_LABEL[x]?(REQ_LABEL[x][A.lang]||REQ_LABEL[x].en):x;}
function roleName(rid){const r=ROLES.find(x=>x.id===rid);return r?r[A.lang]:rid;}
function inboxIncoming(){return A.requests?A.requests.filter(r=>r.toRole===A.role&&r.status==='PENDING'):[];}
function inboxOutgoing(){return A.requests?A.requests.filter(r=>r.fromRole===A.role):[];}
function createRequest(type,toRole,payload){
  A.reqSeq=(A.reqSeq||0)+1;
  const r=Object.assign({id:'REQ-'+A.reqSeq,type,toRole,fromRole:A.role,fromParty:actingParty(),status:'PENDING',at:A.day},payload||{});
  A.requests.unshift(r);
  logOk((isLo()?'ສົ່ງຄຳຂໍ ':'Request ')+reqLabel(type)+' → '+roleName(toRole)+(r.lotRef?' · '+r.lotRef:''));
  toast(isLo()?'ສົ່ງຄຳຂໍແລ້ວ · ລໍຖ້າອະນຸມັດ':'Request sent · pending','good'); render(); return r;
}
function acceptRequest(id){const r=A.requests.find(x=>x.id===id);if(!r||r.status!=='PENDING')return;r.status='ACCEPTED';fulfill(r);render();}
function rejectRequest(id){const r=A.requests.find(x=>x.id===id);if(!r)return;r.status='REJECTED';logNo((isLo()?'ປະຕິເສດຄຳຂໍ ':'Rejected ')+reqLabel(r.type)+' '+r.id);toast(isLo()?'ປະຕິເສດຄຳຂໍແລ້ວ':'Rejected','bad');render();}
function fulfill(r){
  const lot=r.lotRef?A.lots[r.lotRef]:null;
  if(r.type==='INSPECT'&&lot){ lot.state='CERTIFIED'; lot.zb=true; A.certs[lot.id]={by:A.role,at:A.day};
    pushLedger({type:'certify',lot:lot.id,from:roleName('field'),to:lot.holder,qty:lot.qty,price:0});
    r.status='FULFILLED'; logOk((isLo()?'ອອກໃບຮັບຮອງ ':'Certified ')+lot.id+' · Zero-Burn'); toast(isLo()?'ອອກໃບຮັບຮອງແລ້ວ · ແຈ້ງຊາວສວນ':'Certified','good'); }
  else if(r.type==='DEPOSIT'&&lot){ lot.wh='W1'; lot.state='IN_WAREHOUSE'; lot.since=A.day;
    pushLedger({type:'intake',lot:lot.id,from:lot.holder,to:lot.holder,qty:lot.qty,price:0});
    r.status='FULFILLED'; logMv((isLo()?'ຮັບເຂົ້າສາງ ':'Intake ')+lot.id+' · '+(isLo()?'ອອກໃບຝາກ':'receipt')); toast(isLo()?'ຮັບເຂົ້າສາງ + ອອກໃບຝາກແລ້ວ':'Received + receipt','good'); }
  else if(r.type==='PURCHASE'&&lot){ const value=r.price*lot.qty*1000, seller=lot.holder; if((A.wallets[r.fromParty]||0)<value){toast(isLo()?'ຜູ້ຊື້ເງິນບໍ່ພຽງພໍ':'Buyer funds too low','bad');logNo((isLo()?'ອະນຸມັດບໍ່ໄດ້: ເງິນບໍ່ພຽງພໍ ':'Cannot fulfil: funds ')+pn(r.fromParty));r.status='PENDING';} else { const ok=doTransfer(lot.id,r.fromParty,r.price,isLo()?'ຂາຍຕາມໃບສັ່ງຊື້ ':'Sold via order '); if(ok){payFor(r.fromParty,seller,value);r.status='FULFILLED';toast(isLo()?'ຮັບອໍເດີ້ + ໂອນ + ຊຳລະເງິນ':'Accepted + transferred + paid','good');}else{r.status='PENDING';} } }
  else if(r.type==='QUOTA'){ const q=r.qty||500; A.quota.granted+=q; r.status='FULFILLED'; logOk((isLo()?'ອະນຸມັດໂຄຕ້າ +':'Quota +')+q+'T → '+roleName(r.fromRole)); toast(isLo()?'ອະນຸມັດໂຄຕ້າແລ້ວ':'Quota granted','good'); }
  else { r.status='FULFILLED'; }
}

  mkLot(id,{crop:{lo:'ເຂົ້າຫອມມະລິ',en:'Jasmine Rice'},qty:10,wh:null,holder:actingParty(),tier:1,origin:[slid+' · '+(isLo()?'ສວນໃໝ່':'new farm')],since:A.day,zb:false,note:{lo:'ລົງທະບຽນໃໝ່ · ລໍຖ້າກວດ',en:'newly registered · awaiting inspection'}});
  A.lots[id].state='GROWING'; A.slids.push(slid);
  pushLedger({type:'register',lot:id,from:'—',to:actingParty(),qty:10,price:0});
  logOk((isLo()?'ລົງທະບຽນທີ່ດິນ ':'Registered ')+slid+' → '+id+' (GROWING)');
  toast(isLo()?'ລົງທະບຽນທີ່ດິນແລ້ວ · ສ້າງ SLId+ລ໊ອດ':'Farm registered · SLId+lot','good'); render();
}
function pendingReqFor(lotId){return A.requests.find(r=>r.lotRef===lotId&&r.status==='PENDING');}
function actRequestInspect(lotId){const lot=lotId?A.lots[lotId]:farmerLot(['GROWING']);if(!lot||lot.state!=='GROWING'){toast(isLo()?'ແປງນີ້ກວດບໍ່ໄດ້ (ຕ້ອງເປັນສະຖານະ ປູກ)':'Not inspectable','bad');return;}if(pendingReqFor(lot.id)){toast(isLo()?'ມີຄຳຂໍຢູ່ແລ້ວ ລໍຖ້າອະນຸມັດ':'Already requested','bad');return;}createRequest('INSPECT','field',{lotRef:lot.id,qty:lot.qty});}
function actHarvest(lotId){const lot=lotId?A.lots[lotId]:farmerLot(['CERTIFIED']);if(!lot||lot.state!=='CERTIFIED'){toast(isLo()?'ຕ້ອງຜ່ານການກວດກ່ອນເກັບກ່ຽວ':'Needs certification first','bad');return;}lot.state='HARVESTED';pushLedger({type:'harvest',lot:lot.id,from:actingParty(),to:actingParty(),qty:lot.qty,price:0});logOk((isLo()?'ເກັບກ່ຽວ ':'Harvested ')+lot.id);toast(isLo()?'ບັນທຶກການເກັບກ່ຽວແລ້ວ':'Harvest recorded','good');render();}
function actRequestDeposit(lotId){const lot=lotId?A.lots[lotId]:farmerLot(['HARVESTED']);if(!lot||lot.state!=='HARVESTED'){toast(isLo()?'ຕ້ອງເກັບກ່ຽວກ່ອນຝາກສາງ':'Harvest first','bad');return;}if(pendingReqFor(lot.id)){toast(isLo()?'ມີຄຳຂໍຢູ່ແລ້ວ ລໍຖ້າອະນຸມັດ':'Already requested','bad');return;}createRequest('DEPOSIT','warehouse',{lotRef:lot.id,qty:lot.qty});}
function actSellLot(lotId){const lot=A.lots[lotId];if(!lot||lot.state!=='IN_WAREHOUSE'){toast(isLo()?'ຕ້ອງເຂົ້າສາງກ່ອນຂາຍ':'Must be in warehouse','bad');return;}A.selected=lotId;go('#/app/market');}

const CROP_MAP={jasmine:{lo:'ເຂົ້າຫອມມະລິ',en:'Jasmine Rice'},cassava:{lo:'ມັນສຳປະຫຼັງ',en:'Cassava'},coffee:{lo:'ກາເຟ',en:'Coffee'},banana:{lo:'ກ້ວຍ',en:'Banana'},sticky:{lo:'ເຂົ້າໜຽວ',en:'Sticky Rice'}};
function actRegisterFarmForm(){
  const g=id=>document.getElementById(id);
  const name=((g('reg-name')&&g('reg-name').value)||'').trim()||(isLo()?'ສວນໃໝ່':'New farm');
  const cropSel=(g('reg-crop')&&g('reg-crop').value)||'jasmine';
  const area=Math.max(0.5,+(g('reg-area')&&g('reg-area').value)||5);
  const prov=((g('reg-prov')&&g('reg-prov').value)||'Vientiane').trim();
  const qty=Math.round(area*5*10)/10;
  const n=Object.keys(A.lots).length; const id='L-'+(1041+n); const slid='SL-VTE-'+(1000+A.slids.length);
  mkLot(id,{crop:CROP_MAP[cropSel]||CROP_MAP.jasmine,qty,wh:null,holder:actingParty(),tier:1,origin:[slid+' · '+name],since:A.day,zb:false,note:{lo:name+' · '+prov+' · '+area+' ha · ລໍຖ້າກວດ',en:name+' · '+prov+' · '+area+' ha · awaiting inspection'}});
  A.lots[id].state='GROWING'; A.slids.push(slid);
  pushLedger({type:'register',lot:id,from:'—',to:actingParty(),qty,price:0});
  logOk((isLo()?'ລົງທະບຽນທີ່ດິນ ':'Registered ')+slid+' · '+name+' → '+id);
  A.modal=null; toast(isLo()?'ລົງທະບຽນທີ່ດິນແລ້ວ · ສ້າງ SLId+ລ໊ອດ':'Plot registered','good'); render();
}
function plotNext(l){
  if(l.state==='GROWING')return{action:'requestInspect',label:isLo()?'ຂໍກວດແປງ':'Request inspection'};
  if(l.state==='CERTIFIED')return{action:'harvest',label:isLo()?'ບັນທຶກການເກັບກ່ຽວ':'Record harvest',gold:1};
  if(l.state==='HARVESTED')return{action:'requestDeposit',label:isLo()?'ຂໍຝາກສາງ':'Request deposit'};
  if(l.state==='IN_WAREHOUSE')return{action:'sellLot',label:isLo()?'ຕັ້ງຂາຍ':'Sell',gold:1};
  return null;
}
function plotRow(l){
  const pend=pendingReqFor(l.id); const next=plotNext(l);
  const cell=pend?`<span class="chip gold">${reqLabel(pend.type)} · ${isLo()?'ລໍຖ້າອະນຸມັດ':'pending'}</span>`
    :(next?`<button class="btn sm ${next.gold?'gold':'ghost'}" data-action="${next.action}" data-lot="${l.id}">${next.label} →</button>`:`<span class="pgsub" style="font-size:12px">${l.state==='TRADED'?(isLo()?'ຂາຍແລ້ວ':'sold'):'—'}</span>`);
  return `<tr><td class="role" style="text-align:left"><b class="mono" style="font-size:12px">${l.id}</b><br><span style="font-family:'IBM Plex Mono';font-size:10px;color:var(--muted)">${l.origin[0]||''}</span></td><td>${l.crop[A.lang]}</td><td class="mono">${l.qty} T</td><td><span class="chip g">${stateTh(l.state)}</span>${l.zb?' <span class="chip g">✓</span>':''}</td><td style="text-align:right">${cell}</td></tr>`;
}

function fldOptions(opt){
 if(opt==='crop') return Object.keys(CROP_MAP).map(k=>[k,CROP_MAP[k][A.lang]]);
 if(opt==='party') return Object.keys(PARTY).map(id=>[id,pn(id)]);
 if(opt==='role') return ROLES.map(r=>[r.id,r[A.lang]]);
 if(opt==='animal') return [['cattle',isLo()?'ງົວ':'Cattle'],['buffalo',isLo()?'ຄວາຍ':'Buffalo'],['pig',isLo()?'ໝູ':'Pig'],['chicken',isLo()?'ໄກ່':'Chicken']];
 if(opt==='inspectResult') return [['pass',isLo()?'ຜ່ານ · ອອກໃບຮັບຮອງ':'Pass · certify'],['fail',isLo()?'ບໍ່ຜ່ານ · ຂຶ້ນບັນຊີດຳ':'Fail · blacklist']];
 if(opt==='buyableLots') return Object.values(A.lots).filter(l=>['IN_WAREHOUSE','TRADED','PROCESSED'].includes(l.state)&&l.holder!==actingParty()).map(l=>[l.id,l.id+' · '+l.crop[A.lang]+' · '+l.qty+'T · '+pn(l.holder)]);
 if(opt==='myTradable') return Object.values(A.lots).filter(l=>l.holder===actingParty()&&['IN_WAREHOUSE','TRADED'].includes(l.state)).map(l=>[l.id,l.id+' · '+l.crop[A.lang]+' · '+l.qty+'T']);
 if(opt==='growingLots') return Object.values(A.lots).filter(l=>l.state==='GROWING').map(l=>[l.id,l.id+' · '+pn(l.holder)]);
 if(opt==='allLots') return Object.values(A.lots).map(l=>[l.id,l.id+' · '+l.crop[A.lang]+' · '+stateTh(l.state)]);
 return [];
}

function newLotId(){return 'L-'+(1041+Object.keys(A.lots).length);}
function hIntake(v){const id=newLotId();const qty=+v.qty||10;mkLot(id,{crop:CROP_MAP[v.crop]||CROP_MAP.jasmine,qty,wh:'W1',holder:actingParty(),tier:1,origin:[pn(v.from)+' · intake'],since:A.day,zb:true,note:{lo:'ຮັບເຂົ້າສາງໂດຍກົງ',en:'Direct intake'}});A.lots[id].state='IN_WAREHOUSE';pushLedger({type:'intake',lot:id,from:v.from,to:actingParty(),qty,price:0});logMv((isLo()?'ຮັບເຂົ້າສາງ ':'Intake ')+id+' · '+qty+'T');toast(isLo()?'ຮັບເຂົ້າສາງ + ອອກໃບຝາກແລ້ວ':'Received + receipt','good');render();}
function hFactoryOrder(v){if(!v.lot){toast(isLo()?'ບໍ່ມີລ໊ອດ':'No lot','bad');return;}actPurchaseOrder(v.lot,+v.price);}
function hConvert(v){if(!v.lot){toast(isLo()?'ບໍ່ມີລ໊ອດ':'No lot','bad');return;}convert(v.lot);}
function hAnimalReg(v){const id=newLotId();const slid='SL-VTE-'+(1000+A.slids.length);const cnt=+v.count||20;const AN={cattle:{lo:'ງົວ',en:'Cattle'},buffalo:{lo:'ຄວາຍ',en:'Buffalo'},pig:{lo:'ໝູ',en:'Pig'},chicken:{lo:'ໄກ່',en:'Chicken'}};mkLot(id,{crop:AN[v.animal]||AN.cattle,qty:cnt,wh:null,holder:actingParty(),tier:1,origin:[slid+' · '+(v.name||'farm')],since:A.day,zb:false,note:{lo:'ຟາມສັດ · ລໍກວດ',en:'Livestock · awaiting inspection'}});A.lots[id].state='GROWING';A.slids.push(slid);pushLedger({type:'register',lot:id,from:'—',to:actingParty(),qty:cnt,price:0});logOk((isLo()?'ລົງທະບຽນຟາມສັດ ':'Registered livestock ')+slid+' → '+id);toast(isLo()?'ລົງທະບຽນຟາມສັດແລ້ວ':'Livestock registered','good');render();}
function hInspect(v){const lot=A.lots[v.lot];if(!lot){toast(isLo()?'ບໍ່ມີແປງ':'No plot','bad');return;}if(v.result==='fail'){lot.zb=false;lot.blacklist=true;pushLedger({type:'blacklist',lot:lot.id,from:roleName('field'),to:lot.holder,qty:lot.qty,price:0});logNo((isLo()?'ຂຶ້ນບັນຊີດຳ ':'Blacklisted ')+lot.id);toast(isLo()?'ຂຶ້ນບັນຊີດຳແລ້ວ':'Blacklisted','bad');}else{lot.state='CERTIFIED';lot.zb=true;A.certs[lot.id]={by:A.role,at:A.day};pushLedger({type:'certify',lot:lot.id,from:roleName('field'),to:lot.holder,qty:lot.qty,price:0});logOk((isLo()?'ອອກໃບຮັບຮອງ ':'Certified ')+lot.id);toast(isLo()?'ອອກໃບຮັບຮອງແລ້ວ':'Certified','good');}render();}
function hLogiJob(v){const lot=A.lots[v.lot];if(!lot){toast(isLo()?'ບໍ່ມີລ໊ອດ':'No lot','bad');return;}const fee=+v.fee||0;pushLedger({type:'logistics',lot:lot.id,from:isLo()?'ຟາມ':'Farm',to:isLo()?'ສາງ':'WH',qty:lot.qty,price:0});logMv((isLo()?'ຂົນສົ່ງ ':'Transport ')+lot.id+' · '+(isLo()?'ຄ່າ ':'fee ')+money(fee));toast(isLo()?'ຂົນສົ່ງສຳເລັດ (ຮັບ→ສົ່ງ)':'Transport done','good');render();}
function hSetFloor(v){const nf=Math.round(+v.amount||A.floor);if(nf<A.floor){toast(isLo()?'ຫ້າມປັບຫຼຸດຕ່ຳກວ່າເດີມ':'Cannot lower floor','bad');return;}A.floor=nf;logOk((isLo()?'ຕັ້ງ Floor Price = ':'Floor set = ')+money(nf));toast(isLo()?'ປັບ Floor Price ແລ້ວ':'Floor updated','good');render();}
function hQuotaCap(v){const add=Math.round(+v.amount||0);A.quota.granted+=add;logOk((isLo()?'ຕັ້ງໂຄຕ້າຊາດ + ':'Quota + ')+add+'T');toast(isLo()?'ຕັ້ງໂຄຕ້າຊາດແລ້ວ':'Quota set','good');render();}
function hAddUser(v){logOk((isLo()?'ເພີ່ມຜູ້ໃຊ້ ':'Added user ')+(v.name||'user')+' · '+roleName(v.role));toast(isLo()?'ເພີ່ມຜູ້ໃຊ້ + ກຳນົດສິດແລ້ວ':'User added','good');render();}
function actReport(){const phys=physicalStock();logOk((isLo()?'ອອກລາຍງານ · ':'Report · ')+'Vol '+money(A.tradeVolume)+' · Stock '+phys.toFixed(1)+'T · Tx '+A.ledger.length);A.modal=null;A.report=true;render();}
const ST_LABEL={REGISTERED:{lo:'ລົງທະບຽນ',en:'Registered'},CERTIFIED:{lo:'ຮັບຮອງແລ້ວ',en:'Certified'},IN_WAREHOUSE:{lo:'ຢູ່ໃນສາງ',en:'In warehouse'},TRADED:{lo:'ຊື້ຂາຍແລ້ວ',en:'Traded'},PROCESSED:{lo:'ແປຮູບແລ້ວ',en:'Processed'},EXPORTED:{lo:'ສົ່ງອອກແລ້ວ',en:'Exported'}};
function stLabel(s){const o=ST_LABEL[s];return o?o[A.lang]:s;}
function reportOverlayHTML(){
 const lots=Object.values(A.lots), phys=physicalStock();
 const byState={}; lots.forEach(l=>byState[l.state]=(byState[l.state]||0)+1);
 const byHolder={}; lots.forEach(l=>byHolder[l.holder]=(byHolder[l.holder]||0)+l.qty);
 const top=Object.entries(byHolder).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const payouts=A.ledger.filter(e=>e.type==='payout'); const paySum=payouts.reduce((a,e)=>a+(e.amount||0),0);
 const rec=A.ledger.slice(0,14);
 const entTxt=e=>{const who=(e.from&&e.from!=='—'?pn(e.from):'')+(e.to?' → '+pn(e.to):'');return (e.type||'')+(e.lot&&e.lot!=='—'?' '+e.lot:'')+(who?' · '+who:'');};
 const valTxt=e=>e.price?money(e.price)+'/kg':(e.amount?money(e.amount):(e.fee?money(e.fee):'—'));
 return `<div class="report-ov" data-report-close>
   <div class="report-doc">
     <div class="report-bar">
       <button class="btn ghost sm" data-report-close>✕ ${isLo()?'ປິດ':'Close'}</button>
       <button class="btn sm" id="report-print">🖨 ${isLo()?'ພິມ / ບັນທຶກ PDF':'Print / Save PDF'}</button></div>
     <div class="report-page">
       <div class="rp-head">
         <div><div class="rp-brand">LAO AGRO LINK CENTER</div><div class="rp-sub">${isLo()?'ສູນຂໍ້ມູນ ແລະ ການຄ້າກະສິກຳແຫ່ງຊາດ':'National Agri Data & Trade Center'}</div></div>
         <div class="rp-meta">${isLo()?'ລາຍງານລະບົບ':'System report'}<br>${roleLabel()||'—'}<br>${isLo()?'ວັນທີລະບົບ':'System day'} ${A.day}</div></div>
       <h1>${isLo()?'ລາຍງານພາບລວມການຄ້າກະສິກຳ':'Agri-Trade Overview Report'}</h1>
       <div class="rp-kpi">
         <div><span>Trade Volume</span><b>${money(A.tradeVolume)}</b></div>
         <div><span>Physical Stock</span><b>${phys.toFixed(1)} T</b></div>
         <div><span>${isLo()?'ທຸລະກຳ':'Transactions'}</span><b>${A.ledger.length}</b></div>
         <div><span>Floor Price</span><b>${money(A.floor)}<i>/kg</i></b></div>
         <div><span>${isLo()?'ໂຄຕ້າເຫຼືອ':'Quota left'}</span><b>${A.quota.granted-A.quota.consumed}<i> T</i></b></div>
         <div><span>Escrow / Payout</span><b>${money(A.escrowHeld)}<i> · ${money(paySum)}</i></b></div>
       </div>
       <h2>${isLo()?'ລ໊ອດຕາມສະຖານະ':'Lots by state'}</h2>
       <table><thead><tr><th>${isLo()?'ສະຖານະ':'State'}</th><th style="text-align:right">${isLo()?'ຈຳນວນລ໊ອດ':'Lots'}</th></tr></thead><tbody>${Object.entries(byState).map(([s,n])=>`<tr><td>${stLabel(s)}</td><td style="text-align:right">${n}</td></tr>`).join('')||`<tr><td colspan="2">—</td></tr>`}</tbody></table>
       <h2>${isLo()?'ຜູ້ຖືຄອງລ໊ອດຫຼາຍທີ່ສຸດ':'Top lot holders'}</h2>
       <table><thead><tr><th>${isLo()?'ຝ່າຍ':'Party'}</th><th style="text-align:right">${isLo()?'ປະລິມານ':'Quantity'}</th></tr></thead><tbody>${top.map(([id,q])=>`<tr><td>${pn(id)}</td><td style="text-align:right">${q} T</td></tr>`).join('')||`<tr><td colspan="2">—</td></tr>`}</tbody></table>
       <h2>${isLo()?'ບັນຊີການເຄື່ອນໄຫວລ່າສຸດ':'Recent ledger activity'}</h2>
       <table><thead><tr><th>#</th><th>${isLo()?'ລາຍການ':'Entry'}</th><th style="text-align:right">${isLo()?'ມູນຄ່າ':'Value'}</th></tr></thead><tbody>${rec.map(e=>`<tr><td>${e.seq}</td><td>${entTxt(e)}</td><td style="text-align:right">${valTxt(e)}</td></tr>`).join('')||`<tr><td colspan="3">—</td></tr>`}</tbody></table>
       <div class="rp-foot">${isLo()?'ອອກໂດຍ AGRO LINK CENTER · ເອກະສານຈຳລອງ (prototype)':'Generated by AGRO LINK CENTER · prototype document'} · ${new Date().toISOString().slice(0,10)}</div>
     </div>
   </div>
 </div>`;
}
function govActions(){
 let a=[];
 if(A.role==='tradedept') a=[[isLo()?'ຕັ້ງ/ປັບ Floor':'Set Floor',null,'shield',null,'setfloor'],[isLo()?'ກ່ອງຄຳຂໍໂຄຕ້າ':'Quota inbox','inbox','inbox'],[isLo()?'ອອກລາຍງານ':'Report',null,'chart','report']];
 else if(A.role==='ministry') a=[[isLo()?'ຕັ້ງໂຄຕ້າຊາດ':'National quota',null,'bank',null,'quotacap'],[isLo()?'ອອກລາຍງານ':'Report',null,'chart','report'],[isLo()?'ກ່ອງຄຳຂໍ':'Inbox','inbox','inbox']];
 else if(A.role==='province') a=[[isLo()?'ກ່ອງອະນຸມັດ':'Approvals','inbox','inbox'],[isLo()?'ອອກລາຍງານແຂວງ':'Provincial report',null,'chart','report']];
 else if(A.role==='admin') a=[[isLo()?'ເພີ່ມຜູ້ໃຊ້/ສິດ':'Add user',null,'shield',null,'adduser'],[isLo()?'ຕັ້ງ Floor':'Set Floor',null,'shield',null,'setfloor'],[isLo()?'ກ່ອງຄຳຂໍ':'Inbox','inbox','inbox']];
 if(!a.length) return '';
 return `<div class="block"><div class="bh"><h3>${isLo()?'ການດຳເນີນການ':'Actions'}</h3></div><div class="qa">${a.map(x=>`<button ${x[4]?`data-modal-open="${x[4]}"`:x[3]?`data-action="${x[3]}"`:`data-nav="${x[1]}"`}><span class="ic">${svg(x[2],22)}</span>${x[0]}</button>`).join('')}</div></div>`;
}
function modalHTML(){
  if(A.modal&&FORMS[A.modal]) return formModalHTML(A.modal);
  if(A.modal==='quota') return quotaModalHTML();
  if(A.modal!=='register') return '';
  const cropOpts=Object.keys(CROP_MAP).map(k=>`<option value="${k}">${CROP_MAP[k][A.lang]}</option>`).join('');
  return `<div class="modalbg" data-modal-close><div class="modal">
    <h3>${isLo()?'ລົງທະບຽນທີ່ດິນໃໝ່':'Register new plot'}</h3>
    <p class="msub">${isLo()?'ໜຶ່ງຄົນມີໄດ້ຫຼາຍແປງ — ປ້ອນຂໍ້ມູນແລ້ວລະບົບສ້າງ SLId + ລ໊ອດໃຫ້':'One owner, many plots — creates an SLId + lot'}</p>
    <label class="fld"><span>${isLo()?'ຊື່ໄຮ່ນາ':'Farm name'}</span><input id="reg-name" placeholder="${isLo()?'ເຊັ່ນ ສວນໂພນສະຫວັນ':'e.g. Phonsavan Farm'}"></label>
    <label class="fld"><span>${isLo()?'ຊະນິດພືດ':'Crop'}</span><select id="reg-crop">${cropOpts}</select></label>
    <div class="mrow"><label class="fld" style="flex:1"><span>${isLo()?'ເນື້ອທີ່ (ha)':'Area (ha)'}</span><input id="reg-area" type="number" value="5" min="0.5" step="0.5"></label><label class="fld" style="flex:1"><span>${isLo()?'ແຂວງ':'Province'}</span><input id="reg-prov" value="Vientiane"></label></div>
    <div class="mrow"><button class="btn ghost" data-modal-close>${isLo()?'ຍົກເລີກ':'Cancel'}</button><button class="btn" id="reg-submit">${isLo()?'ລົງທະບຽນ':'Register'}</button></div>
  </div></div>`;
}
function actPurchaseOrder(lotId,price){const lot=A.lots[lotId];if(!lot)return;const buyer=actingParty();if(!buyer){toast(isLo()?'ບົດບາດນີ້ຊື້ບໍ່ໄດ້':'This role cannot buy','bad');return;}if(buyer===lot.holder){toast(isLo()?'ເປັນເຈົ້າຂອງຢູ່ແລ້ວ':'Already owner','bad');return;}if(price<A.floor){toast(isLo()?'ຕ່ຳກວ່າ Floor':'Below floor','bad');return;}createRequest('PURCHASE',roleOfParty(lot.holder),{lotRef:lotId,price:Math.round(price),qty:lot.qty});}
function pInbox(){
  const inc=inboxIncoming(),out=inboxOutgoing();
  return `<div style="margin-bottom:10px"><h2 style="font-size:22px">${isLo()?'ກ່ອງຄຳຂໍ / Inbox':'Requests / Inbox'}</h2><p class="pgsub">${isLo()?'ຄຳຂໍທີ່ລໍຖ້າທ່ານອະນຸມັດ ແລະ ຄຳຂໍທີ່ທ່ານສົ່ງອອກໄປ (ຄລິກຮັບ/ປະຕິເສດ)':'Awaiting your approval, and ones you sent'}</p></div>
  <div class="block"><div class="bh"><h3>${isLo()?'ຄຳຂໍເຂົ້າ (ລໍຖ້າອະນຸມັດ)':'Incoming (pending)'}</h3><span class="chip ${inc.length?'gold':'g'}" style="margin-left:auto">${inc.length}</span></div>
    ${inc.length?inc.map(reqCardIn).join(''):`<p class="pgsub">${isLo()?'ບໍ່ມີຄຳຂໍເຂົ້າ':'No incoming requests'}</p>`}</div>
  <div class="block"><div class="bh"><h3>${isLo()?'ຄຳຂໍທີ່ສົ່ງອອກ':'Sent by me'}</h3></div>
    ${out.length?out.map(reqCardOut).join(''):`<p class="pgsub">${isLo()?'ຍັງບໍ່ໄດ້ສົ່ງຄຳຂໍ':'No sent requests'}</p>`}</div>`;
}
function reqCardIn(r){const lq=r.lotRef&&A.lots[r.lotRef]?A.lots[r.lotRef].qty+'T':(r.qty?r.qty+'T':'');
  return `<div class="reqrow"><div><b>${reqLabel(r.type)}</b> <span class="mono" style="font-size:11px;color:var(--muted)">${r.id}</span><div style="font-size:12.5px;color:var(--muted)">${isLo()?'ຈາກ':'from'} ${roleName(r.fromRole)}${r.lotRef?' · '+r.lotRef:''}${lq?' · '+lq:''}${r.price?' · '+money(r.price)+'/kg':''}</div></div>
   <div class="reqbtns"><button class="btn sm" data-accept="${r.id}">${isLo()?'ຮັບ/ອະນຸມັດ':'Accept'}</button><button class="btn ghost sm" data-reject="${r.id}">${isLo()?'ປະຕິເສດ':'Reject'}</button></div></div>`;}
function reqCardOut(r){const st={PENDING:['gold',isLo()?'ລໍຖ້າອະນຸມັດ':'pending'],ACCEPTED:['g','accepted'],FULFILLED:['g',isLo()?'ສຳເລັດ':'done'],REJECTED:['r',isLo()?'ຖືກປະຕິເສດ':'rejected']}[r.status]||['g',r.status];
  return `<div class="reqrow"><div><b>${reqLabel(r.type)}</b> <span class="mono" style="font-size:11px;color:var(--muted)">${r.id}</span><div style="font-size:12.5px;color:var(--muted)">${isLo()?'ເຖິງ':'to'} ${roleName(r.toRole)}${r.lotRef?' · '+r.lotRef:''}</div></div><span class="chip ${st[0]}">${st[1]}</span></div>`;}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
 const go_=e.target.closest('[data-go]');
 if(go_){ if(go_.dataset.guest==='1'){A.role='guest';} go(go_.dataset.go); return; }
 const roleBtn=e.target.closest('[data-role]');
 if(roleBtn){ A.role=roleBtn.dataset.role; go('#/app/'+perm().nav[0]); return; }
 const moBtn=e.target.closest('[data-modal-open]');
 if(moBtn){ A.modal=moBtn.dataset.modalOpen; render(); return; }
 if(e.target.hasAttribute&&e.target.hasAttribute('data-modal-close')){ A.modal=null; render(); return; }
 if(e.target.closest&&e.target.closest('#report-print')){ window.print(); return; }
 if(e.target.hasAttribute&&e.target.hasAttribute('data-report-close')){ A.report=false; render(); return; }
 if(e.target.id==='reg-submit'){ actRegisterFarmForm(); return; }
 if(e.target.id==='quota-submit'){ actQuotaSubmit(); return; }
 const actBtn=e.target.closest('[data-action]');
 if(actBtn){ const lid=actBtn.dataset.lot; const M={registerFarm:actRegisterFarm,requestInspect:()=>actRequestInspect(lid),harvest:()=>actHarvest(lid),requestDeposit:()=>actRequestDeposit(lid),sellLot:()=>actSellLot(lid),requestQuota:actRequestQuota,report:actReport}; (M[actBtn.dataset.action]||function(){})(); return; }
 const fsBtn=e.target.closest('[data-form-submit]'); if(fsBtn){ submitForm(fsBtn.dataset.formSubmit); return; }
 const accBtn=e.target.closest('[data-accept]'); if(accBtn){ acceptRequest(accBtn.dataset.accept); return; }
 const rejBtn=e.target.closest('[data-reject]'); if(rejBtn){ rejectRequest(rejBtn.dataset.reject); return; }
 if(e.target.closest('#tester-go')){ const sel=document.getElementById('tester-role'); A.role=sel?sel.value:'farmer'; go('#/app/'+perm().nav[0]); return; }
 const navBtn=e.target.closest('[data-nav]');
 if(navBtn){ go('#/app/'+navBtn.dataset.nav); closeSide(); return; }
 const langBtn=e.target.closest('[data-lang]');
 if(langBtn){ A.lang=langBtn.dataset.lang; saveLang(A.lang); render(); return; }
 const thmBtn=e.target.closest('[data-theme-toggle]');
 if(thmBtn){ A.theme=A.theme==='dark'?'light':'dark'; saveTheme(A.theme); applyTheme(); render(); return; }
 const lotBtn=e.target.closest('[data-lot]');
 if(lotBtn){ A.selected=lotBtn.dataset.lot; render(); return; }
 const tabBtn=e.target.closest('[data-tab]');
 if(tabBtn){ A.sideView=tabBtn.dataset.tab; render(); return; }
 const tickBtn=e.target.closest('[data-tick]');
 if(tickBtn){ tickMarket(+tickBtn.dataset.tick); return; }
 const settleBtn=e.target.closest('[data-settle]');
 if(settleBtn){ settleContract(+settleBtn.dataset.settle); return; }
 const toastBtn=e.target.closest('[data-toast]');
 if(toastBtn){ toast(toastBtn.dataset.toast,'good'); return; }
 if(e.target.id==='burger'){ document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('on'); return; }
 if(e.target.id==='scrim'){ closeSide(); return; }
 if(!A.selected) return;
 const buyerEl=document.getElementById('buyer'),priceEl=document.getElementById('tprice');
 const buyer=buyerEl?buyerEl.value:null, price=priceEl?+priceEl.value:0;
 if(e.target.closest('#act-purchase')) actPurchaseOrder(A.selected,price);
 else if(e.target.closest('#act-spot')) transferOwnership(A.selected,buyer,price);
 else if(e.target.closest('#act-contract')) createContract(A.selected,buyer,price);
 else if(e.target.closest('#act-future')) createFuture(A.selected,buyer,price);
 else if(e.target.closest('#act-post')) postOffer(A.selected,price,'spot');
 else if(e.target.closest('#act-convert')) convert(A.selected);
 else if(e.target.closest('#act-withdraw')) withdraw(A.selected);
 else if(e.target.closest('#act-export')) exportLot(A.selected);
});
function closeSide(){const s=document.getElementById('side');if(s)s.classList.remove('open');const sc=document.getElementById('scrim');if(sc)sc.classList.remove('on');}
window.addEventListener('hashchange',render);
A={lang:loadLang(),role:null,theme:loadTheme()};
applyTheme();
seedTrade();
if(!location.hash) location.hash='#/';
render();
</script>
</html>
